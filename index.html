<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Vault By yahya
  </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .nav-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 100; }
    .nav-btn { padding: 12px 18px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; cursor: pointer; font-weight: 600; user-select: none; }
    .nav-btn.active { background: #6366f1; border-color: #818cf8; }
    .nav-btn.admin-nav { background: #78350f; border-color: #b45309; color: #fef3c7; }
    .nav-btn.admin-nav.active { background: #d97706; border-color: #f59e0b; color: #fff; }

    .box { background: #1e293b; border-radius: 12px; padding: 25px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #334155; }
    h2 { margin-bottom: 20px; font-size: 20px; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"], input[type="password"], select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    
    .pass-container { position: relative; }
    .toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; }

    .submit-btn { width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .submit-btn.admin { background: #d97706; }

    .dashboard { display: none; width: 100%; max-width: 800px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e293b; padding: 15px 20px; border-radius: 10px; border: 1px solid #334155; }
    .logout-btn { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }

    .admin-panel { background: #1a1625; border: 1px solid #b45309; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
    th { color: #f59e0b; }
    .user-click { color: #38bdf8; text-decoration: underline; cursor: pointer; font-weight: 600; }
    .delete-btn { background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .inspect-box { background: #0f172a; border: 1px dashed #f59e0b; padding: 15px; border-radius: 8px; margin-top: 15px; }

    .folder-list { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .folder-chip { padding: 6px 14px; background: #334155; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .folder-chip.active { background: #6366f1; font-weight: 600; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #334155; }
    .action-bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; font-size: 14px; margin: 0; }
    .bulk-delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .bulk-delete-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
    .photo-card { position: relative; background: #0f172a; border-radius: 8px; overflow: hidden; padding: 6px; text-align: center; border: 1px solid #334155; cursor: pointer; height: 112px; }
    .photo-card.selected { border-color: #6366f1; background: #1e1b4b; }
    .photo-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; display: block; background: #1e293b; }
    .photo-checkbox { position: absolute; top: 10px; left: 10px; width: 18px; height: 18px; cursor: pointer; z-index: 5; accent-color: #6366f1; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 90%; max-height: 90vh; display: flex; flex-direction: column; align-items: center; border: 1px solid #475569; }
    .modal-content img { max-width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; margin-bottom: 15px; }
    .modal-actions { display: flex; gap: 12px; }
    .download-btn { background: #10b981; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .close-modal-btn { background: #64748b; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    
    #loadingStatus { display: none; font-size: 12px; color: #38bdf8; margin-top: 5px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="nav-bar" id="navBar">
    <button type="button" class="nav-btn active" id="btnModeLogin" onclick="setMode('login')">🔑 Login User</button>
    <button type="button" class="nav-btn" id="btnModeRegister" onclick="setMode('register')">📝 Daftar Baru</button>
    <button type="button" class="nav-btn admin-nav" id="btnModeAdmin" onclick="setMode('admin')">👑 Login Admin</button>
  </div>

  <div class="box" id="authBox">
    <h2 id="formTitle">Login User</h2>
    <form id="mainForm" onsubmit="handleAuth(event)">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="userInput" autocomplete="off" required placeholder="Masukkan username...">
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="pass-container">
          <input type="password" id="passInput" autocomplete="off" required placeholder="Masukkan password...">
          <button type="button" class="toggle-pass" onclick="togglePassword()">👁️</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Masuk</button>
    </form>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="header">
      <div>Halo, <b id="sessionUser">User</b>! <span id="roleBadge"></span></div>
      <button type="button" class="logout-btn" onclick="logout()">Keluar (Logout)</button>
    </div>

    <div class="admin-panel" id="adminPanel" style="display:none;">
      <h3 style="color:#f59e0b;">👑 Panel Pemantauan (Admin)</h3>
      <p style="font-size:12px; color:#cbd5e1; margin-top:4px;">Klik nama username untuk memantau folder dan foto:</p>
      
      <table>
        <thead>
          <tr><th>Username</th><th>Password</th><th>Role</th><th>Aksi</th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>

      <div class="inspect-box" id="inspectBox" style="display:none;">
        <h4 style="color:#38bdf8;" id="inspectTitle">📁 Folder User: -</h4>
        <div class="folder-list" id="adminFolderChips"></div>
        <div class="photo-grid" id="adminPhotoGrid"></div>
      </div>
    </div>

    <div id="userSection" style="background:#1e293b; padding:20px; border-radius:10px; display:none; border:1px solid #334155;">
      <h3>📁 Galeri Folder & Foto Saya</h3>
      
      <div style="margin: 15px 0; text-align: left;">
        <label style="font-size: 12px; color: #94a3b8;">Folder Aktif:</label>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
          <select id="userFolderSelect" onchange="changeFolder(this.value)" style="flex: 1;"></select>
          <button type="button" onclick="createFolder()" style="padding: 8px 14px; background: #10b981; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">+ Folder Baru</button>
        </div>
      </div>

      <div style="text-align: center; border: 2px dashed #475569; padding: 15px; border-radius: 8px; margin-top: 10px;">
        <p style="font-size: 13px; color: #cbd5e1;">Pilih foto untuk diunggah (bisa pilih banyak):</p>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadPhoto(event)" style="margin-top: 8px;">
        <div id="loadingStatus">⚡ Memproses & Mengunggah Kilat...</div>
      </div>

      <div class="folder-list" id="userFolderChips" style="margin-top: 20px;"></div>

      <div class="action-bar" id="actionBar">
        <label>
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
          <span><b>Pilih Semua</b> <small style="color:#94a3b8;">(Ctrl + A)</small></span>
        </label>
        <button type="button" class="bulk-delete-btn" id="deleteSelectedBtn" onclick="deleteSelectedPhotos()" disabled>🗑️ Hapus Terpilih (<span id="selectedCount">0</span>)</button>
      </div>

      <div class="photo-grid" id="userPhotoGrid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="photoModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-content">
      <img id="modalImg" src="" alt="Preview Foto">
      <div class="modal-actions">
        <a id="downloadLink" class="download-btn" download="foto_cloud.png">⬇️ Unduh Foto</a>
        <button type="button" class="close-modal-btn" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>

<script>
  let db;
  // Naikkan versi DB ke 2 agar otomatis memaksa pembaruan data admin
  const dbRequest = indexedDB.open("CloudVaultDB", 2);

  dbRequest.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains("users")) {
      db.createObjectStore("users", { keyPath: "username" });
    }
    if (!db.objectStoreNames.contains("photos")) {
      const photoStore = db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      photoStore.createIndex("user_folder", ["username", "folder"], { unique: false });
    }
  };

  dbRequest.onsuccess = function(e) {
    db = e.target.result;
    forceUpdateAdminPassword();
  };

  function forceUpdateAdminPassword() {
    const tx = db.transaction("users", "readwrite");
    const store = tx.objectStore("users");
    
    // Langsung paksa timpa (put) password admin ke 1234455 setiap kali aplikasi dimuat
    store.get("admin").onsuccess = function(e) {
      let adminData = e.target.result;
      if (adminData) {
        adminData.password = "1234455";
        store.put(adminData);
      } else {
        store.put({ username: "admin", password: "1234455", role: "admin", folders: [] });
      }
    };
  }

  let currentUser = null;
  let mode = 'login';
  let activeFolder = null;
  let adminTargetUser = null;
  let adminTargetFolder = null;
  let selectedPhotoIndexes = new Set();
  let currentPhotosCache = [];

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      const isUserSectionVisible = document.getElementById('userSection').style.display !== 'none';
      const isInputFocused = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
      
      if (isUserSectionVisible && !isInputFocused) {
        e.preventDefault();
        if (currentPhotosCache.length > 0) {
          toggleSelectAll(selectedPhotoIndexes.size !== currentPhotosCache.length);
        }
      }
    }
  });

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btnModeLogin').className = 'nav-btn' + (mode === 'login' ? ' active' : '');
    document.getElementById('btnModeRegister').className = 'nav-btn' + (mode === 'register' ? ' active' : '');
    document.getElementById('btnModeAdmin').className = 'nav-btn admin-nav' + (mode === 'admin' ? ' active' : '');

    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    
    document.getElementById('userInput').value = '';
    document.getElementById('passInput').value = '';

    if (mode === 'login') {
      formTitle.innerText = 'Login User';
      submitBtn.innerText = 'Masuk';
      submitBtn.className = 'submit-btn';
    } else if (mode === 'register') {
      formTitle.innerText = 'Daftar Akun Baru';
      submitBtn.innerText = 'Daftar Sekarang';
      submitBtn.className = 'submit-btn';
    } else {
      formTitle.innerText = 'Login Admin';
      submitBtn.innerText = 'Masuk Sebagai Admin';
      submitBtn.className = 'submit-btn admin';
    }
  }

  function togglePassword() {
    const input = document.getElementById('passInput');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function handleAuth(e) {
    e.preventDefault();
    const u = document.getElementById('userInput').value.trim().toLowerCase();
    const p = document.getElementById('passInput').value.trim();

    if (!u || !p) return;

    const tx = db.transaction("users", "readwrite");
    const store = tx.objectStore("users");

    if (mode === 'register') {
      store.get(u).onsuccess = function(e) {
        if (e.target.result) {
          alert('❌ Username sudah terdaftar!');
        } else {
          store.put({ username: u, password: p, role: 'user', folders: [] });
          alert('✅ Akun berhasil dibuat! Silakan login.');
          setMode('login');
        }
      };
    } else if (mode === 'admin') {
      store.get(u).onsuccess = function(e) {
        const user = e.target.result;
        if (user && user.password === p && user.role === 'admin') {
          currentUser = user;
          renderDashboard();
        } else {
          alert('❌ Username/Password Admin Salah!');
        }
      };
    } else {
      store.get(u).onsuccess = function(e) {
        const user = e.target.result;
        if (user && user.password === p) {
          currentUser = user;
          renderDashboard();
        } else {
          alert('❌ Username/Password Salah!');
        }
      };
    }
  }

  function renderDashboard() {
    document.getElementById('navBar').style.display = 'none';
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('sessionUser').innerText = currentUser.username;

    if (currentUser.role === 'admin') {
      document.getElementById('roleBadge').innerHTML = '<span style="color:#f59e0b; font-size:12px;">(Admin Mode)</span>';
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('userSection').style.display = 'none';
      renderAdminTable();
    } else {
      document.getElementById('roleBadge').innerText = '';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      if (!currentUser.folders) currentUser.folders = [];
      activeFolder = currentUser.folders.length > 0 ? currentUser.folders[0] : null;
      renderUserGallery();
    }
  }

  function renderAdminTable() {
    const tx = db.transaction("users", "readonly");
    const store = tx.objectStore("users");
    const request = store.getAll();

    request.onsuccess = function(e) {
      const users = e.target.result;
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';
      users.forEach((u) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="user-click" onclick="inspectUser('${u.username}')">📁 ${u.username}</span></td>
          <td>${u.password}</td>
          <td><span style="color:${u.role === 'admin' ? '#f59e0b' : '#94a3b8'}">${u.role}</span></td>
          <td>${u.role !== 'admin' ? `<button class="delete-btn" onclick="deleteUser('${u.username}')">Hapus</button>` : '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    };
  }

  function deleteUser(username) {
    if (confirm(`Hapus user "${username}"?`)) {
      const tx = db.transaction(["users", "photos"], "readwrite");
      tx.objectStore("users").delete(username);
      
      const photoStore = tx.objectStore("photos");
      const index = photoStore.index("user_folder");
      const request = index.openCursor(IDBKeyRange.bound([username, "compat"], [username, "compat\uffff"]));
      request.onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          photoStore.delete(cursor.primaryKey);
          cursor.continue();
        }
      };

      tx.oncomplete = () => {
        if (adminTargetUser === username) document.getElementById('inspectBox').style.display = 'none';
        renderAdminTable();
      };
    }
  }

  function inspectUser(username) {
    adminTargetUser = username;
    document.getElementById('inspectBox').style.display = 'block';
    document.getElementById('inspectTitle').innerText = `📁 Inspection User: "${username}"`;
    
    const tx = db.transaction("users", "readonly");
    tx.objectStore("users").get(username).onsuccess = function(e) {
      const user = e.target.result;
      const folders = user && user.folders ? user.folders : [];
      adminTargetFolder = folders.length > 0 ? folders[0] : null;
      renderAdminFolders(folders);
    };
  }

  function renderAdminFolders(folders) {
    const chips = document.getElementById('adminFolderChips');
    chips.innerHTML = '';

    if (!folders || folders.length === 0) {
      chips.innerHTML = '<i style="font-size:12px; color:#94a3b8;">User ini belum memiliki folder.</i>';
      document.getElementById('adminPhotoGrid').innerHTML = '';
      return;
    }

    folders.forEach(f => {
      const chip = document.createElement('div');
      chip.className = 'folder-chip' + (f === adminTargetFolder ? ' active' : '');
      chip.innerText = `📂 ${f}`;
      chip.onclick = () => { adminTargetFolder = f; renderAdminFolders(folders); };
      chips.appendChild(chip);
    });

    renderAdminPhotos();
  }

  function renderAdminPhotos() {
    const grid = document.getElementById('adminPhotoGrid');
    grid.innerHTML = '';

    if (!adminTargetFolder) return;

    const tx = db.transaction("photos", "readonly");
    const store = tx.objectStore("photos");
    const index = store.index("user_folder");
    const request = index.getAll([adminTargetUser, adminTargetFolder]);

    request.onsuccess = function(e) {
      const photos = e.target.result;
      if (photos.length === 0) {
        grid.innerHTML = '<p style="font-size:12px; color:#94a3b8; grid-column: 1/-1;">Folder kosong.</p>';
        return;
      }

      photos.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `<img src="${p.dataUrl}" loading="lazy">`;
        card.onclick = () => openModal(p.dataUrl, `foto_${adminTargetUser}_${i+1}.png`);
        grid.appendChild(card);
      });
    };
  }

  function createFolder() {
    const name = prompt('Masukkan nama folder baru:');
    if (name && name.trim()) {
      const cleanName = name.trim();
      if (!currentUser.folders.includes(cleanName)) {
        currentUser.folders.push(cleanName);
        saveUserToDB(() => {
          activeFolder = cleanName;
          selectedPhotoIndexes.clear();
          renderUserGallery();
        });
      } else {
        alert('Folder sudah ada!');
      }
    }
  }

  function changeFolder(val) {
    activeFolder = val;
    selectedPhotoIndexes.clear();
    renderUserGallery();
  }

  function saveUserToDB(callback) {
    const tx = db.transaction("users", "readwrite");
    tx.objectStore("users").put(currentUser);
    tx.oncomplete = () => { if (callback) callback(); };
  }

  // KOMPRESI KILAT DENGAN PROMISE.ALL
  function compressImage(file, maxWidth = 750, quality = 0.65) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
      };
    });
  }

  async function uploadPhoto(e) {
    if (!activeFolder) {
      alert('Buat/Pilih folder terlebih dahulu!');
      e.target.value = '';
      return;
    }

    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    const statusMsg = document.getElementById('loadingStatus');
    statusMsg.style.display = 'block';
    statusMsg.innerText = `⚡ Memproses ${files.length} foto secara kilat...`;

    const compressionPromises = files.map(file => compressImage(file));
    const compressedDataUrls = await Promise.all(compressionPromises);

    const tx = db.transaction("photos", "readwrite");
    const store = tx.objectStore("photos");

    compressedDataUrls.forEach(dataUrl => {
      store.add({
        username: currentUser.username,
        folder: activeFolder,
        dataUrl: dataUrl
      });
    });

    tx.oncomplete = () => {
      statusMsg.style.display = 'none';
      renderUserGallery();
    };

    e.target.value = '';
  }

  function togglePhotoSelect(index, e) {
    if (e) e.stopPropagation();
    if (selectedPhotoIndexes.has(index)) {
      selectedPhotoIndexes.delete(index);
    } else {
      selectedPhotoIndexes.add(index);
    }
    updateSelectionUI();
  }

  function toggleSelectAll(checked) {
    selectedPhotoIndexes.clear();
    if (checked) {
      currentPhotosCache.forEach((_, i) => selectedPhotoIndexes.add(i));
    }
    updateSelectionUI();
  }

  function updateSelectionUI() {
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const deleteBtn = document.getElementById('deleteSelectedBtn');
    const countSpan = document.getElementById('selectedCount');

    selectAllCheckbox.checked = currentPhotosCache.length > 0 && selectedPhotoIndexes.size === currentPhotosCache.length;
    countSpan.innerText = selectedPhotoIndexes.size;
    deleteBtn.disabled = selectedPhotoIndexes.size === 0;

    const cards = document.querySelectorAll('#userPhotoGrid .photo-card');
    cards.forEach((card, index) => {
      const chk = card.querySelector('.photo-checkbox');
      const isSelected = selectedPhotoIndexes.has(index);
      if (chk) chk.checked = isSelected;
      if (isSelected) card.classList.add('selected');
      else card.classList.remove('selected');
    });
  }

  function deleteSelectedPhotos() {
    if (selectedPhotoIndexes.size === 0) return;
    if (confirm(`Hapus ${selectedPhotoIndexes.size} foto yang dipilih?`)) {
      const tx = db.transaction("photos", "readwrite");
      const store = tx.objectStore("photos");

      const sortedIndexes = Array.from(selectedPhotoIndexes).sort((a, b) => b - a);
      sortedIndexes.forEach(idx => {
        const photoId = currentPhotosCache[idx].id;
        store.delete(photoId);
      });

      tx.oncomplete = () => {
        selectedPhotoIndexes.clear();
        renderUserGallery();
      };
    }
  }

  function renderUserGallery() {
    const folders = currentUser.folders || [];
    if (!activeFolder && folders.length > 0) activeFolder = folders[0];

    const select = document.getElementById('userFolderSelect');
    select.innerHTML = '';

    if (folders.length === 0) {
      select.innerHTML = '<option>-- Belum Ada Folder --</option>';
    } else {
      folders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.innerText = f;
        if (f === activeFolder) opt.selected = true;
        select.appendChild(opt);
      });
    }

    const chips = document.getElementById('userFolderChips');
    chips.innerHTML = '';
    folders.forEach(f => {
      const chip = document.createElement('div');
      chip.className = 'folder-chip' + (f === activeFolder ? ' active' : '');
      chip.innerText = `📂 ${f}`;
      chip.onclick = () => { activeFolder = f; selectedPhotoIndexes.clear(); renderUserGallery(); };
      chips.appendChild(chip);
    });

    const grid = document.getElementById('userPhotoGrid');
    grid.innerHTML = '';

    if (!activeFolder) {
      grid.innerHTML = '<p style="font-size:12px; color:#94a3b8; grid-column: 1/-1;">Buat folder baru untuk mengunggah foto.</p>';
      currentPhotosCache = [];
      updateSelectionUI();
      return;
    }

    const tx = db.transaction("photos", "readonly");
    const store = tx.objectStore("photos");
    const index = store.index("user_folder");
    const request = index.getAll([currentUser.username, activeFolder]);

    request.onsuccess = function(e) {
      currentPhotosCache = e.target.result;
      
      if (currentPhotosCache.length === 0) {
        grid.innerHTML = '<p style="font-size:12px; color:#94a3b8; grid-column: 1/-1;">Belum ada foto di folder ini.</p>';
        updateSelectionUI();
        return;
      }

      const fragment = document.createDocumentFragment();

      currentPhotosCache.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card' + (selectedPhotoIndexes.has(i) ? ' selected' : '');
        
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'photo-checkbox';
        chk.checked = selectedPhotoIndexes.has(i);
        chk.onclick = (e) => togglePhotoSelect(i, e);

        const img = document.createElement('img');
        img.src = p.dataUrl;
        img.loading = "lazy";

        card.appendChild(chk);
        card.appendChild(img);

        card.onclick = (e) => {
          if (e.target === chk) return;
          openModal(p.dataUrl, `foto_${i+1}.png`);
        };

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
      updateSelectionUI();
    };
  }

  function logout() {
    currentUser = null;
    activeFolder = null;
    adminTargetUser = null;
    currentPhotosCache = [];
    selectedPhotoIndexes.clear();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('navBar').style.display = 'flex';
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('inspectBox').style.display = 'none';
    setMode('login');
  }

  function openModal(url, filename) {
    document.getElementById('modalImg').src = url;
    const downloadLink = document.getElementById('downloadLink');
    downloadLink.href = url;
    downloadLink.download = filename;
    document.getElementById('photoModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('photoModal').style.display = 'none';
  }
</script>
</body>
</html>
